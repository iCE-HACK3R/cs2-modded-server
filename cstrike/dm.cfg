// Deathmatch Mode Configuration
// Usage: exec dm.cfg

echo "Loading Deathmatch mode..."

// Pause other mode plugins
amxx pause gungame.amxx
amxx pause PugCore.amxx
amxx pause PugAdmin.amxx
amxx pause PugAux.amxx
amxx pause PugConfigs.amxx
amxx pause PugFlood.amxx
amxx pause PugLO3.amxx
amxx pause PugMenus.amxx
amxx pause PugReady.amxx
amxx pause PugWarmup.amxx
// amxx pause kreedz.amxx
// amxx pause usurf.amxx

// Activate Deathmatch plugins
amxx unpause csdmsake.amxx
amxx unpause csdmsake_equip.amxx
amxx unpause csdmsake_spawn.amxx
amxx unpause csdmsake_fixes.amxx
amxx unpause csdmsake_display.amxx
amxx unpause AQS.amxx

// Persist mode across map changes (amxx.cfg pauses all, then calls this alias)
alias currentmode "amxx unpause csdmsake.amxx; amxx unpause csdmsake_equip.amxx; amxx unpause csdmsake_spawn.amxx; amxx unpause csdmsake_fixes.amxx; amxx unpause csdmsake_display.amxx; amxx unpause AQS.amxx"

// Deathmatch settings (FFA via mp_friendlyfire)
mp_friendlyfire 1
mp_autoteambalance 1
mp_limitteams 0
mp_roundtime 9
mp_freezetime 0
mp_buytime 0.5
mp_startmoney 16000
mp_maxrounds 0
mp_winlimit 0
mp_timelimit 30

// Switch map cycle and change to a Deathmatch map
mapcyclefile mapcycle_dm.txt
exec custom_dm.cfg
changelevel fy_pool_day
