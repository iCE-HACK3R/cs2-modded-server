// Vanilla Mode Configuration
// Usage: exec vanilla.cfg

echo "Loading Vanilla mode..."

// Pause all mode plugins
amxx pause gungame.amxx
amxx pause csdmsake.amxx
amxx pause csdmsake_equip.amxx
amxx pause csdmsake_spawn.amxx
amxx pause csdmsake_fixes.amxx
amxx pause csdmsake_display.amxx
amxx pause AQS.amxx
amxx pause PugCore.amxx
amxx pause PugAdmin.amxx
amxx pause PugAux.amxx
amxx pause PugConfigs.amxx
amxx pause PugFlood.amxx
amxx pause PugLO3.amxx
amxx pause PugMenus.amxx
amxx pause PugReady.amxx
amxx pause PugWarmup.amxx
amxx pause kreedz.amxx
amxx pause usurf.amxx

// Clear mode persistence (everything stays paused)
alias currentmode ""

// Standard settings
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 2
mp_roundtime 2.5
mp_freezetime 3
mp_buytime 0.25
mp_startmoney 800
mp_c4timer 45
mp_maxrounds 0
mp_winlimit 0
mp_timelimit 30

// Switch map cycle and change to a standard map
mapcyclefile mapcycle.txt
exec custom_vanilla.cfg
changelevel de_dust2
