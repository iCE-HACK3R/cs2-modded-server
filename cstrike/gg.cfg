// GunGame Mode Configuration
// Usage: exec gg.cfg

echo "Loading GunGame mode..."

// Pause other mode plugins
amxx pause csdmsake.amxx
amxx pause csdmsake_equip.amxx
amxx pause csdmsake_spawn.amxx
amxx pause csdmsake_fixes.amxx
amxx pause csdmsake_display.amxx
amxx pause PugCore.amxx
amxx pause PugAdmin.amxx
amxx pause PugAux.amxx
amxx pause PugConfigs.amxx
amxx pause PugFlood.amxx
amxx pause PugLO3.amxx
amxx pause PugMenus.amxx
amxx pause PugReady.amxx
amxx pause PugWarmup.amxx
// amxx pause kreedz.amxx
// amxx pause usurf.amxx

// Activate GunGame plugins
amxx unpause gungame.amxx
amxx unpause AQS.amxx

// Persist mode across map changes (amxx.cfg pauses all, then calls this alias)
alias currentmode "amxx unpause gungame.amxx; amxx unpause AQS.amxx"

// GunGame settings
mp_friendlyfire 1
mp_autoteambalance 1
mp_limitteams 0
mp_roundtime 9
mp_freezetime 0
mp_buytime 0
mp_startmoney 0
mp_maxrounds 0
mp_winlimit 0
mp_timelimit 30

// Switch map cycle and change to a GunGame map
mapcyclefile mapcycle_gg.txt
exec custom_gg.cfg
changelevel fy_pool_day
