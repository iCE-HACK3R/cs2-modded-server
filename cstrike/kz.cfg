// KZ (Kreedz Climbing) Mode Configuration
// Usage: exec kz.cfg

echo "Loading KZ mode..."

// Pause other mode plugins
amxx pause gungame.amxx
amxx pause csdmsake.amxx
amxx pause csdmsake_equip.amxx
amxx pause csdmsake_spawn.amxx
amxx pause csdmsake_fixes.amxx
amxx pause csdmsake_display.amxx
amxx pause AQS.amxx
amxx pause PugCore.amxx
amxx pause PugAdmin.amxx
amxx pause PugAux.amxx
amxx pause PugConfigs.amxx
amxx pause PugFlood.amxx
amxx pause PugLO3.amxx
amxx pause PugMenus.amxx
amxx pause PugReady.amxx
amxx pause PugWarmup.amxx
amxx pause usurf.amxx

// Activate KZ plugin
amxx unpause kreedz.amxx

// Persist mode across map changes (amxx.cfg pauses all, then calls this alias)
alias currentmode "amxx unpause kreedz.amxx"

// KZ settings
sv_airaccelerate 100
sv_maxvelocity 2000
mp_friendlyfire 0
mp_autoteambalance 0
mp_limitteams 0
mp_roundtime 9
mp_freezetime 0
mp_buytime 0
mp_startmoney 0
mp_maxrounds 0
mp_winlimit 0
mp_timelimit 0

// Switch map cycle and change to a KZ map
mapcyclefile mapcycle_kz.txt
exec custom_kz.cfg
changelevel surf_egypt
