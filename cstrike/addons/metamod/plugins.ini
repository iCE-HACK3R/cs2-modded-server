; Metamod plugins.ini
; Tells Metamod which plugins to load.
; Format: <platform> <filepath> [<description>]
;
; Both linux and win32 entries are listed so this file works on both platforms.
; Metamod ignores entries for the other platform automatically.

linux addons/amxmodx/dlls/amxmodx_mm_i386.so
win32 addons/amxmodx/dlls/amxmodx_mm.dll
