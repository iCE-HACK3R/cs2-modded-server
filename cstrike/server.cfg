// CS 1.6 Server Configuration
// This file is overlaid on top of the default HLDS cstrike/server.cfg
// Secrets (rcon_password, sv_password) are passed as command line +args by launch scripts

hostname "CS 1.6 Server"

// Network
sv_maxrate 25000
sv_minrate 5000
sv_maxupdaterate 101
sv_minupdaterate 20

// Server settings
mp_autoteambalance 1
mp_friendlyfire 0
mp_autokick 0
mp_flashlight 1
mp_footsteps 1
mp_timelimit 30
mp_roundtime 2.5
mp_freezetime 3
mp_buytime 0.25
mp_startmoney 800
mp_c4timer 45
mp_tkpunish 0
mp_forcechasecam 0
mp_limitteams 2

// Logging
log on
sv_logbans 1
sv_logecho 1
sv_logfile 1

// LAN / Online (set to 0 for online, 1 for LAN)
sv_lan 0

// Allow downloads
sv_allowdownload 1
sv_allowupload 1

// Bots (0 = no bots, increase for bot-filled server)
bot_quota 0

exec custom_server.cfg
echo "server.cfg executed"
