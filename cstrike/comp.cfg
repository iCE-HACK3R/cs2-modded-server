// Competitive Mode Configuration (PugMod)
// Usage: exec comp.cfg
// Players type .ready to start the match flow (vote map, pick teams, knife round, LO3)

echo "Loading Competitive mode..."

// Pause other mode plugins
amxx pause gungame.amxx
amxx pause csdmsake.amxx
amxx pause csdmsake_equip.amxx
amxx pause csdmsake_spawn.amxx
amxx pause csdmsake_fixes.amxx
amxx pause csdmsake_display.amxx
amxx pause AQS.amxx
amxx pause kreedz.amxx
amxx pause usurf.amxx

// Activate PugMod plugins
amxx unpause PugCore.amxx
amxx unpause PugAdmin.amxx
amxx unpause PugAux.amxx
amxx unpause PugConfigs.amxx
amxx unpause PugFlood.amxx
amxx unpause PugLO3.amxx
amxx unpause PugMenus.amxx
amxx unpause PugReady.amxx
amxx unpause PugWarmup.amxx

// Persist mode across map changes (amxx.cfg pauses all, then calls this alias)
alias currentmode "amxx unpause PugCore.amxx; amxx unpause PugAdmin.amxx; amxx unpause PugAux.amxx; amxx unpause PugConfigs.amxx; amxx unpause PugFlood.amxx; amxx unpause PugLO3.amxx; amxx unpause PugMenus.amxx; amxx unpause PugReady.amxx; amxx unpause PugWarmup.amxx"

// PugMod handles match settings via esl.rc/warmup.rc/etc.
// These base settings apply during warmup/lobby
mp_friendlyfire 0
mp_autoteambalance 0
mp_limitteams 0
mp_timelimit 0
mp_maxrounds 0

// Switch map cycle and change to a competitive map
mapcyclefile mapcycle_comp.txt
exec custom_comp.cfg
changelevel de_dust2
