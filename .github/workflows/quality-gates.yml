name: quality gates

on:
  pull_request:
  push:
    branches:
      - master
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-manager:
    name: dependency manager (${{ matrix.platform }}, ${{ matrix.css_variant }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            css_variant: framework-dependent
          - os: ubuntu-latest
            platform: linux-x64
            css_variant: with-runtime
          - os: windows-latest
            platform: windows-x64
            css_variant: framework-dependent
          - os: windows-latest
            platform: windows-x64
            css_variant: with-runtime
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m compileall -q scripts/dependency_manager.py tests/test_dependency_manager.py

      - name: Run adversarial tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            message=$(tail -n 100 unittest.log)
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=Adversarial test failure::$message"
            exit "$status"
          fi

      - name: Validate dependency lock
        run: python scripts/dependency_manager.py validate

      - name: Fetch and stage Metamod Source
        shell: bash
        run: |
          python scripts/dependency_manager.py stage metamod-source \
            --platform "${{ matrix.platform }}" \
            --variant framework-dependent \
            --cache .cache/dependencies \
            --output .stage/metamod-source

      - name: Test transactional Metamod install
        shell: bash
        run: |
          mkdir -p .install-target/addons/metamod/bin .install-target/addons/metamod
          printf 'stale' > .install-target/addons/metamod/bin/stale-loader
          printf 'operator-owned\n' > .install-target/addons/metamod/metaplugins.ini
          python scripts/dependency_manager.py install metamod-source \
            --platform "${{ matrix.platform }}" \
            --variant framework-dependent \
            --cache .cache/dependencies \
            --target .install-target
          test ! -e .install-target/addons/metamod/bin/stale-loader
          test "$(cat .install-target/addons/metamod/metaplugins.ini)" = "operator-owned"

      - name: Fetch and stage CounterStrikeSharp
        shell: bash
        run: |
          python scripts/dependency_manager.py stage counterstrikesharp \
            --platform "${{ matrix.platform }}" \
            --variant "${{ matrix.css_variant }}" \
            --cache .cache/dependencies \
            --output .stage/counterstrikesharp

      - name: Fetch and stage Custom Votes
        shell: bash
        run: |
          python scripts/dependency_manager.py stage cs2-customvotes \
            --platform "${{ matrix.platform }}" \
            --variant framework-dependent \
            --cache .cache/dependencies \
            --output .stage/customvotes

  linux-scripts:
    name: Linux script syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate shell syntax
        run: bash -n install.sh install_docker.sh run.sh start.sh stop.sh scripts/*.sh
